; ============================================================================
; supervisord — process manager for the monolithic image.
; ============================================================================
; Internal services bind to 127.0.0.1 on ports in the 1xxxx range to avoid
; clashing with anything else on the host (we run with network_mode=host,
; so 127.0.0.1:8080 is the host's loopback). Defaults from entrypoint.sh:
;   API_PORT=18080, LOG_STREAM_PORT=18081, WEBHOOK_PORT=18888
; Override in .env if these clash with something on your host.
; ============================================================================

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ---------------------------------------------------------------------------
; PostgreSQL — initialised on first start by /usr/local/bin/postgres-init.sh
; (called from /entrypoint.sh before supervisord takes over).
; ---------------------------------------------------------------------------
[program:postgres]
command=/usr/lib/postgresql/17/bin/postgres -D /app/db/postgres -c config_file=/app/db/postgres/postgresql.conf
user=postgres
priority=10
autostart=true
autorestart=true
startsecs=5
stopsignal=INT
stopwaitsecs=30
stdout_logfile=/var/log/supervisor/postgres.log
stderr_logfile=/var/log/supervisor/postgres.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

; ---------------------------------------------------------------------------
; ocserv — VPN server. Configuration is regenerated by /entrypoint.sh on
; every container start to reflect current env (RADIUS toggle, OC_ROUTES,
; split-dns, camouflage, proxy-proto, etc.).
; ---------------------------------------------------------------------------
[program:ocserv]
# --log-stderr makes ocserv write its log stream to stderr, which supervisord
# captures into /var/log/supervisor/ocserv.err.log. Without this flag, ocserv
# defaults to syslog — and we don't run rsyslogd inside this image, so all
# of ocserv's interesting log lines (sec-mod errors, RADIUS exchanges, worker
# crashes) silently disappear. The startup banner you see in the err log is
# only the part written before --log-stderr / --syslog is honoured.
command=/usr/sbin/ocserv --foreground --log-stderr --config=/etc/ocserv/ocserv.conf
priority=50
autostart=true
autorestart=true
startretries=10
stdout_logfile=/var/log/supervisor/ocserv.log
stderr_logfile=/var/log/supervisor/ocserv.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

; ---------------------------------------------------------------------------
; api — runs DB migrations on startup (`api migrate`) then `api serve`.
; Waits for postgres readiness via pg_isready in a tight loop (cheaper than
; arbitrary sleeps).
; ---------------------------------------------------------------------------
[program:api]
# Wait for postgres socket, then run migrations and start the API server.
# We target the Unix socket directly here. POSTGRES_HOST in env may be
# either "127.0.0.1" (then entrypoint.sh rewrites it) or already the
# socket path; pg_isready -h is independent of that env value.
command=/bin/bash -c "until pg_isready -h /var/run/postgresql -U $POSTGRES_USER -d $POSTGRES_DB -q; do sleep 1; done; api migrate && exec api serve --host 127.0.0.1 --port ${API_PORT:-18080}"
directory=/app
priority=60
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/var/log/supervisor/api.log
stderr_logfile=/var/log/supervisor/api.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:webhook]
command=/usr/local/bin/webhook
environment=WEBHOOK_PORT="%(ENV_WEBHOOK_PORT)s"
priority=60
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/webhook.log
stderr_logfile=/var/log/supervisor/webhook.err.log

[program:log_stream]
# Wait for the embedded postgres socket to appear before starting. Without
# this, supervisord spawns log_stream the same second it spawns postgres,
# log_stream's first DB-connect tries 0.05s later when there is no socket
# yet, fails fatally and supervisor restarts it 1s later. That works but
# spams the logs and costs a couple of seconds at boot. The pg_isready
# loop is the same pattern api uses; targeting Unix socket via -h matches
# entrypoint.sh's POSTGRES_HOST rewrite.
command=/bin/bash -c "until pg_isready -h /var/run/postgresql -U $POSTGRES_USER -d $POSTGRES_DB -q; do sleep 1; done; exec /usr/local/bin/log_stream -h 127.0.0.1 -p ${LOG_STREAM_PORT:-18081}"
priority=70
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/var/log/supervisor/log_stream.log
stderr_logfile=/var/log/supervisor/log_stream.err.log

[program:user_expiry]
# Same gate as log_stream/api: wait for the postgres socket. user_expiry
# also needs the schema to exist (api migrate has run), so we sleep an
# extra few seconds after the DB is up. Even if migrations are slower than
# that, user_expiry just logs a transient "relation does not exist" and
# its next cron iteration finds the tables.
command=/bin/bash -c "until pg_isready -h /var/run/postgresql -U $POSTGRES_USER -d $POSTGRES_DB -q; do sleep 1; done; sleep 3; exec /usr/local/bin/user_expiry -docker-mode"
priority=70
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/var/log/supervisor/user_expiry.log
stderr_logfile=/var/log/supervisor/user_expiry.err.log

; ---------------------------------------------------------------------------
; nginx — final layer.
; ---------------------------------------------------------------------------
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=90
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx.err.log

; ---------------------------------------------------------------------------
; certbot_renew — only effective when CERTBOT_ENABLED=true. The script does
; nothing and exits cleanly when the toggle is off.
; ---------------------------------------------------------------------------
[program:certbot_renew]
command=/usr/local/bin/certbot-renew.sh
priority=95
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/var/log/supervisor/certbot.log
stderr_logfile=/var/log/supervisor/certbot.err.log
