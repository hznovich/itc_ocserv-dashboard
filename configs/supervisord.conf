[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log

[program:ocserv]
command=/usr/sbin/ocserv --foreground --config=/etc/ocserv/ocserv.conf
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/ocserv.log
# --- Rotation settings ---
# Maximum file size before rotation (e.g., 10 MB)
stdout_logfile_maxbytes=10MB
# Number of stored archives (ocserv.log.1, ocserv.log.2 ...)
stdout_logfile_backups=5

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/nginx.err.log
stdout_logfile=/var/log/supervisor/nginx.out.log

[program:api]
command=/usr/local/bin/api serve --host 127.0.0.1 --port 8080
directory=/app
environment=DATABASE_URL="/app/db/db.sqlite"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/api.err.log
stdout_logfile=/var/log/supervisor/api.out.log

[program:log_stream]
command=/usr/local/bin/log_stream -h 127.0.0.1 -p 8081
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/log_stream.err.log
stdout_logfile=/var/log/supervisor/log_stream.out.log

[program:webhook]
command=/usr/local/bin/webhook
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/webhook.err.log
stdout_logfile=/var/log/supervisor/webhook.out.log

[program:user_expiry]
command=/usr/local/bin/user_expiry -docker-mode
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/expiry.err.log
stdout_logfile=/var/log/supervisor/expiry.out.log